<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนที่วางแผนการบิน</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<style>
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile,.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile{transition:none}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-bar{border-radius:5px;box-shadow:0 1px 5px rgba(0,0,0,.65);overflow:hidden}
.leaflet-bar a{display:block;width:30px;height:30px;line-height:30px;text-align:center;background:#fff;color:#000;text-decoration:none;border-bottom:1px solid #ccc;font:700 18px/30px sans-serif}
.leaflet-bar a:last-child{border-bottom:none}
.leaflet-control-layers{background:#fff;color:#111;border-radius:5px;padding:6px 10px;box-shadow:0 1px 5px rgba(0,0,0,.65);font-size:13px}
.leaflet-control-layers-toggle{display:none}
.leaflet-control-layers label{display:block}
.leaflet-control-scale-line{background:rgba(255,255,255,.8);border:2px solid #777;border-top:none;padding:2px 5px;font-size:11px;color:#333;white-space:nowrap}
.leaflet-control-attribution{background:rgba(255,255,255,.8);font-size:11px;padding:0 5px;color:#333}
.leaflet-control-attribution a{color:#0063a6;text-decoration:none}
.leaflet-interactive{cursor:pointer}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1722;--panel:#112233;--panel2:#16304a;--line:#2a4560;--text:#e8f0f6;--mute:#8fa8bd;--amber:#f5b335;--cyan:#5cd0e6;--red:#ff7a6b;
--sans:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--sans)}
body{display:flex;flex-direction:row;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#panel{width:360px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
#mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#0a1620;cursor:crosshair}
.leaflet-container{font-family:var(--sans)}
header{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:600;margin:0 0 10px}
.search{display:flex;gap:6px}
input,select,button{font:inherit;color:var(--text)}
input,select{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.search input{flex:1}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--cyan)}
button.primary{background:var(--amber);border-color:var(--amber);color:#1a1200;font-weight:600}
.totals{padding:16px 18px;border-bottom:1px solid var(--line)}
.big{font-family:var(--mono);font-size:38px;font-weight:500;color:var(--amber);line-height:1}
.big small{font-size:16px;color:var(--mute);margin-left:6px}
.sub{display:flex;gap:20px;margin-top:12px;font-family:var(--mono);font-size:15px}
.sub span{display:block;font-family:var(--sans);font-size:12px;color:var(--mute)}
.units{display:flex;gap:0;margin-top:14px}
.units button{flex:1;border-radius:0;padding:6px}
.units button:first-child{border-radius:6px 0 0 6px}.units button:last-child{border-radius:0 6px 6px 0}
.units button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#04202a;font-weight:600}
.params{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.params label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.params input{font-family:var(--mono);width:100%}
.legs{padding:10px 18px;flex:1}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:400;color:var(--mute);text-align:right;padding:4px 4px 6px;font-size:12px}
th:first-child,td:first-child{text-align:left}
td{padding:7px 4px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono)}
td:first-child{font-family:var(--sans)}
td button{padding:0 7px;line-height:22px;color:var(--red);background:none;border:none}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--amber);color:#1a1200;text-align:center;font:600 12px/20px var(--mono);margin-right:6px}
.empty{color:var(--mute);font-size:14px;line-height:1.6;padding:8px 0}
.actions{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.actions button{flex:1}
.note{font-size:12px;color:var(--mute);padding:0 18px 16px;line-height:1.5}
.pin{width:26px;height:26px;border-radius:50%;background:var(--amber);color:#1a1200;border:2px solid #fff;text-align:center;font:600 13px/22px var(--mono);box-shadow:0 1px 6px rgba(0,0,0,.5)}
.pin.first{background:var(--cyan)}
.leglabel{background:rgba(11,23,34,.88);color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:1px 6px;font:500 12px var(--mono);white-space:nowrap;width:auto!important;height:auto!important;transform:translate(-50%,-50%)}
@media (max-width:760px){
 body{flex-direction:column-reverse}
 #panel{width:100%;height:46vh;border-right:none;border-top:1px solid var(--line)}
 #mapwrap{flex:1}
 .big{font-size:30px}
}
</style>
</head>
<body>
<aside id="panel">
 <header>
  <h1>แผนที่วางแผนการบิน</h1>
  <form class="search" id="searchForm">
   <input id="q" type="search" placeholder="ค้นหาสถานที่ หรือสนามบิน" aria-label="ค้นหาสถานที่">
   <button type="submit">ค้นหา</button>
  </form>
 </header>
 <section class="totals" aria-live="polite">
  <div class="big"><span id="tDist">0</span><small id="tUnit">NM</small></div>
  <div class="sub">
   <div><span>เวลาบิน</span><b id="tTime">–</b></div>
   <div><span>เชื้อเพลิง</span><b id="tFuel">–</b></div>
   <div><span>จำนวนช่วง</span><b id="tLegs">0</b></div>
  </div>
  <div class="units" role="group" aria-label="หน่วยระยะทาง">
   <button data-u="nm" aria-pressed="true">ไมล์ทะเล</button>
   <button data-u="km" aria-pressed="false">กิโลเมตร</button>
   <button data-u="mi" aria-pressed="false">ไมล์</button>
  </div>
 </section>
 <section class="params">
  <label>ความเร็วเดินทาง (knots)<input id="speed" type="number" min="1" value="120"></label>
  <label>เชื้อเพลิงต่อชั่วโมง<input id="burn" type="number" min="0" value="40"></label>
 </section>
 <section class="legs">
  <div id="legs"></div>
 </section>
 <div class="actions">
  <button id="undo">ย้อนกลับจุดล่าสุด</button>
  <button id="clear">ล้างเส้นทาง</button>
 </div>
 <p class="note">ใช้ประเมินคร่าวๆ เท่านั้น ไม่รวมลม ระดับความสูง น่านฟ้า หรือพื้นที่ห้ามบิน ห้ามใช้แทนการวางแผนการบินจริง</p>
</aside>
<div id="mapwrap"><div id="map"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
 var R_NM=3440.065, rad=Math.PI/180, deg=180/Math.PI;
 var UF={nm:1,km:1.852,mi:1.150779}, UL={nm:'NM',km:'km',mi:'mi'};
 var unit='nm', pts=[];

 var sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'});
 var osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
 var topo=L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap, OpenStreetMap contributors'});
 var map=L.map('map',{center:[13.5,101],zoom:6,layers:[sat],worldCopyJump:true,zoomControl:true});
 var provPane=map.createPane('prov');provPane.style.zIndex=350;provPane.style.pointerEvents='none';
 var provLayer=L.layerGroup().addTo(map);
 var provURLs=['https://cdn.jsdelivr.net/gh/chingchai/OpenGISData-Thailand/provinces.geojson','https://raw.githubusercontent.com/chingchai/OpenGISData-Thailand/master/provinces.geojson','https://raw.githubusercontent.com/chingchai/OpenGISData-Thailand/main/provinces.geojson'];
 function loadProv(i){
  if(i>=provURLs.length){console.warn('โหลดเส้นแบ่งจังหวัดไม่สำเร็จ');return}
  fetch(provURLs[i]).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
   .then(function(g){L.geoJSON(g,{pane:'prov',renderer:L.canvas({pane:'prov'}),interactive:false,style:{color:'#ffffff',weight:1,opacity:.75,fill:false}}).addTo(provLayer)})
   .catch(function(){loadProv(i+1)});
 }
 loadProv(0);
 L.control.layers({'ภาพดาวเทียม':sat,'แผนที่ถนน':osm,'ภูมิประเทศ':topo},{'เส้นแบ่งจังหวัด':provLayer}).addTo(map);
 L.control.scale({imperial:false,metric:true}).addTo(map);
 var lineLayer=L.layerGroup().addTo(map), markerLayer=L.layerGroup().addTo(map);

 function dist(a,b){
  var p1=a.lat*rad,p2=b.lat*rad,dl=(b.lng-a.lng)*rad,dp=p2-p1;
  var h=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R_NM*Math.asin(Math.min(1,Math.sqrt(h)));
 }
 function course(a,b){
  var p1=a.lat*rad,p2=b.lat*rad,dl=(b.lng-a.lng)*rad;
  var y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  return (Math.atan2(y,x)*deg+360)%360;
 }
 function arc(a,b){
  var d=dist(a,b)/R_NM, out=[], n=Math.max(2,Math.ceil(d*deg/2));
  var p1=a.lat*rad,l1=a.lng*rad,p2=b.lat*rad,l2=b.lng*rad;
  var prev=a.lng;
  for(var i=0;i<=n;i++){
   var f=i/n, lat, lng;
   if(d<1e-9){lat=a.lat;lng=a.lng}
   else{
    var A=Math.sin((1-f)*d)/Math.sin(d),B=Math.sin(f*d)/Math.sin(d);
    var x=A*Math.cos(p1)*Math.cos(l1)+B*Math.cos(p2)*Math.cos(l2);
    var y=A*Math.cos(p1)*Math.sin(l1)+B*Math.cos(p2)*Math.sin(l2);
    var z=A*Math.sin(p1)+B*Math.sin(p2);
    lat=Math.atan2(z,Math.sqrt(x*x+y*y))*deg; lng=Math.atan2(y,x)*deg;
   }
   while(lng-prev>180)lng-=360;
   while(lng-prev<-180)lng+=360;
   prev=lng; out.push([lat,lng]);
  }
  return out;
 }
 function fmtT(h){
  if(!isFinite(h))return '–';
  var m=Math.round(h*60),hh=Math.floor(m/60),mm=m%60;
  return hh+' ชม. '+(mm<10?'0':'')+mm+' น.';
 }
 function fmtD(nm){var v=nm*UF[unit]; return v>=100?v.toFixed(0):v.toFixed(1);}
 function num(id){var v=parseFloat(document.getElementById(id).value);return isFinite(v)?v:0}

 function drawLines(){
  lineLayer.clearLayers();
  var total=0,legs=[],unwrap=0;
  for(var i=1;i<pts.length;i++){
   var a=pts[i-1],b=pts[i],d=dist(a,b),c=course(a,b);
   total+=d; legs.push({d:d,c:c});
   var path=arc(a,b);
   L.polyline(path,{color:'#f5b335',weight:3,opacity:.95,interactive:false}).addTo(lineLayer);
   var mid=path[Math.floor(path.length/2)];
   L.marker(mid,{interactive:false,icon:L.divIcon({className:'leglabel',html:fmtD(d)+' '+UL[unit]})}).addTo(lineLayer);
  }
  var spd=num('speed'),burn=num('burn'),hrs=spd>0?total/spd:NaN;
  document.getElementById('tDist').textContent=fmtD(total);
  document.getElementById('tUnit').textContent=UL[unit];
  document.getElementById('tTime').textContent=pts.length>1?fmtT(hrs):'–';
  document.getElementById('tFuel').textContent=(pts.length>1&&isFinite(hrs))?(hrs*burn).toFixed(0):'–';
  document.getElementById('tLegs').textContent=legs.length;
  var el=document.getElementById('legs');
  if(!pts.length){el.innerHTML='<p class="empty">คลิกบนแผนที่เพื่อวางจุดแรก แล้วคลิกต่อไปเรื่อยๆ เพื่อสร้างเส้นทาง ลากหมุดเพื่อย้ายจุดได้</p>';return}
  var h='<table><thead><tr><th>จุด</th><th>ระยะ</th><th>ทิศ</th><th>เวลา</th><th></th></tr></thead><tbody>';
  pts.forEach(function(p,i){
   var lg=legs[i-1];
   h+='<tr><td><span class="dot">'+(i+1)+'</span>'+(i===0?'ต้นทาง':'')+'</td>'+
    '<td>'+(lg?fmtD(lg.d):'')+'</td>'+
    '<td>'+(lg?('000'+Math.round(lg.c)%360).slice(-3)+'°':'')+'</td>'+
    '<td>'+(lg&&spd>0?fmtT(lg.d/spd).replace(' ชม. ',':').replace(' น.',''):'')+'</td>'+
    '<td><button data-del="'+i+'" aria-label="ลบจุด '+(i+1)+'">✕</button></td></tr>';
  });
  el.innerHTML=h+'</tbody></table>';
 }
 function drawMarkers(){
  markerLayer.clearLayers();
  pts.forEach(function(p,i){
   var m=L.marker([p.lat,p.lng],{draggable:true,icon:L.divIcon({className:'',html:'<div class="pin'+(i===0?' first':'')+'">'+(i+1)+'</div>',iconSize:[26,26],iconAnchor:[13,13]})});
   m.on('drag',function(e){var ll=e.target.getLatLng();p.lat=ll.lat;p.lng=ll.lng;drawLines()});
   m.on('dragend',function(e){var ll=e.target.getLatLng().wrap();p.lat=ll.lat;p.lng=ll.lng;drawLines()});
   m.addTo(markerLayer);
  });
 }
 function refresh(){drawMarkers();drawLines()}

 map.on('click',function(e){var ll=e.latlng.wrap();pts.push({lat:ll.lat,lng:ll.lng});refresh()});
 document.getElementById('undo').onclick=function(){pts.pop();refresh()};
 document.getElementById('clear').onclick=function(){pts=[];refresh()};
 document.getElementById('legs').addEventListener('click',function(e){
  var t=e.target.closest('[data-del]');if(!t)return;
  pts.splice(parseInt(t.getAttribute('data-del'),10),1);refresh();
 });
 document.querySelectorAll('.units button').forEach(function(b){
  b.onclick=function(){
   unit=b.getAttribute('data-u');
   document.querySelectorAll('.units button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
   drawLines();
  };
 });
 ['speed','burn'].forEach(function(id){document.getElementById(id).addEventListener('input',drawLines)});
 document.getElementById('searchForm').addEventListener('submit',function(e){
  e.preventDefault();
  var q=document.getElementById('q').value.trim();if(!q)return;
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q))
   .then(function(r){return r.json()})
   .then(function(j){
    if(!j.length){alert('ไม่พบสถานที่ "'+q+'" ลองใช้ชื่ออื่นหรือเพิ่มชื่อประเทศ');return}
    map.flyTo([parseFloat(j[0].lat),parseFloat(j[0].lon)],11);
   })
   .catch(function(){alert('ค้นหาไม่สำเร็จ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต')});
 });
 refresh();
})();
</script>
</body>
</html>
