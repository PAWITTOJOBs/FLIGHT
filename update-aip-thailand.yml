name: Update Thailand AIP

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # 11:00 UTC = 18:00 Asia/Bangkok every Monday.
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-thailand-aip
  cancel-in-progress: false

jobs:
  update-aip:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update Thailand AIP snapshot
        run: |
          python scripts/update_aip_thailand.py

      - name: Show changes
        run: |
          git status --short
          git diff --stat || true

      - name: Commit and push only when AIP changed
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No AIP changes detected."
            exit 0
          fi

          EFFECTIVE_DATE="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/aip-thailand/current/metadata.json')
          if p.exists():
              print(json.loads(p.read_text(encoding='utf-8')).get('effective_date', 'unknown'))
          else:
              print('unknown')
          PY
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aip-thailand/current data/aip-thailand/last-check.json
          git commit -m "chore(aip): update Thailand AIP ${EFFECTIVE_DATE}"
          git push
